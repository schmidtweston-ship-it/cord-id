<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0a08">
<title>Our Stories · Schmidt House</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="wallet.css">
<style>
.wal{max-width:560px}.hold{cursor:pointer}
.blank{width:72px;height:96px;border:1px dashed var(--rule);display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:28px}
.big .hold{grid-template-columns:120px 1fr}.big .hold img,.big .blank{width:120px;height:160px}
.story{background:var(--panel);border:1px solid var(--rule);padding:16px;font-size:18px;white-space:pre-wrap;min-height:120px;margin-top:16px}
.story.empty{color:var(--muted);font-style:italic}
textarea{width:100%;min-height:320px;background:#110e0b;border:1px solid var(--rule);color:var(--ink);padding:12px;font:18px/1.5 var(--serif);margin-top:16px}
button,.btn{background:var(--gold);color:#0c0a08;border:0;padding:12px 16px;font:600 15px var(--sans);margin:12px 8px 0 0;cursor:pointer;display:inline-block}
button.soft,.btn.soft{background:transparent;color:var(--gold);border:1px solid var(--rule)}
.back{font-family:var(--sans);font-size:14px;display:inline-block;margin:14px 0}
#msg{font-family:var(--sans);color:var(--gold);font-size:14px;min-height:20px;margin-top:8px}
footer{margin-top:28px;text-align:center;font-family:var(--sans);color:var(--gold);letter-spacing:.2em;text-transform:uppercase;font-size:12px}
footer b{display:block;font:400 22px var(--serif);letter-spacing:.04em;color:var(--ink);text-transform:none}
</style></head><body><main class="wal">

</head>
<body>
<main class="wal">
  <div class="kicker">Schmidt House · Our Stories</div>
  <h1>Our Stories</h1>
  <div id="view"></div>
  <p class="links"><a href="./">Registry</a> · <a href="wallet.html">AI Digital Wallet</a></p>
  <footer><b>Weston and Eve</b>Equal Always</footer>
</main>
<script src="stories.js"></script>
</body>
</html>
